<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль - Linguevinchik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="logo.png" alt="Logo" class="nav-logo"> Linguevinchik
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Про нас</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Реєстрація</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Вхід</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Профіль</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-info" href="study.html">Навчання</a></li>
                </ul>
            </div>
        </div>
    </nav>
   <main class="container py-5" id="app">
    <div v-if="user" class="card p-4 shadow-sm text-center">
        <h2>Профіль користувача</h2>
        <table class="table mt-4">
            <tr><td>Ім'я:</td><td>{{ user.name }}</td></tr>
            <tr><td>Email:</td><td>{{ user.email }}</td></tr>
            <tr><td>Стать:</td><td>{{ user.gender }}</td></tr>
            <tr><td>Дата народження:</td><td>{{ user.birthDate }}</td></tr>
        </table>
        <button @click="logout" class="btn btn-danger mt-3">Вийти з акаунту</button>
    </div>
</main>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/auth.js"></script>
</body>
</html>
