<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навчання - Linguevinchik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="logo.png" alt="Logo" class="nav-logo"> Linguevinchik
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Про нас</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Реєстрація</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Вхід</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Профіль</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-info" href="study.html">Навчання</a></li>
                </ul>
            </div>
        </div>
    </nav>
<main class="container py-5" id="app"> 
    <div class="row g-4"> 
        <div class="col-12 col-md-6">
            <div class="card h-100 border-primary shadow-sm p-4 text-center">
                <h5 class="text-primary">Режим вивчення</h5>
                <h2 class="display-3 my-4">{{ currentWord.en }}</h2>
                <hr class="w-25 mx-auto">
                <p class="fs-4 text-muted">{{ currentWord.ua }}</p>
                <button @click="nextWord" class="btn btn-outline-primary mt-3 w-50 mx-auto">Наступне</button>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <div class="card h-100 border-success shadow-sm p-4">
                <h5 class="text-success mb-4">Контроль знань</h5>
                <p class="fw-bold">Оберіть переклад "{{ currentWord.en }}":</p>
                
                <div id="testOptionsContainer">
                    <div v-for="(option, index) in options" :key="index" class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="testQ" 
                               :id="'a' + index" :value="option" v-model="selectedAnswer">
                        <label class="form-check-label" :for="'a' + index">
                            {{ option }}
                        </label>
                    </div>
                </div>
                
                <button @click="checkAnswer" class="btn btn-success mt-4 w-100">Перевірити</button>
            </div>
        </div>
    </div>
</main>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script src="js/study.js"></script>

</body>
</html>
