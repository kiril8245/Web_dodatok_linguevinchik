<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - Linguevinchik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="logo.png" alt="Logo" class="nav-logo"> Linguevinchik
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Про нас</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Реєстрація</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Вхід</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Профіль</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-info" href="study.html">Навчання</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-11 col-md-6 col-lg-4 card p-4 shadow-sm"> 
                <h2 class="text-center mb-4">Реєстрація</h2> 
                <form id="registerForm">
                    <div class="mb-3"><label>Ім'я</label><input type="text" name="name" class="form-control" required></div> 
                    <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div> 
                    <div class="mb-3"><label>Пароль</label><input type="password" name="password" class="form-control" required></div>
                    <div class="mb-3"><label class="d-block">Стать</label> 
                        <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="g" value="Чоловіча" checked><label>Чоловіча</label></div>
                        <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="g" value="Жіноча"><label>Жіноча</label></div>
                    </div>
                    <div class="mb-4"><label>Дата народження</label><input type="date" name="birthDate" class="form-control" required></div> 
                    <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
                </form>
            </div>
        </div>
    </main>
    <script type="module" src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
